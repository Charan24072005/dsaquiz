<style>
:root {
  --accent: #00ffcc;
  --accent-dark: #00e6b5;
  --bg: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

body {
  font-family: "Poppins", sans-serif;
  background: var(--bg);
  color: #fff;
  margin: 0;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  font-size: 14px;
}

.container {
  width: 90%;
  max-width: 600px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  padding: 60px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
  margin: auto;
}

h1 {
  color: var(--accent);
  margin-top: 0px;
  font-size: 1.8rem;
}

h2 {
  font-size: 1.3rem;
  margin-bottom: 35px;
}

h3 {
  font-size: 1.1rem;
  margin-bottom: 20px;
}

p {
  font-size: 0.9rem;
  margin-bottom: 15px;
}

/* 🔹 Category links with effects */
.category-btn {
  display: inline-block;
  text-decoration: none;
  background: var(--accent);
  color: #000;
  padding: 8px 14px;
  margin: 6px 8px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
  font-size: 0.9rem;
  box-shadow: 0 0 8px rgba(0, 255, 200, 0.2);
}

.category-btn:hover {
  background: var(--accent-dark);
  transform: scale(1.05); /* zoom effect */
  box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
}

/* 🔹 General buttons (Next, Go Home, etc.) with hover effects */
.btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 12px 28px;
  margin: 15px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
  font-size: 0.9rem;
  box-shadow: 0 0 10px rgba(0, 255, 200, 0.2);
}

.btn:hover {
  background: var(--accent-dark);
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
}

/* 🔹 Quiz question options with hover effects */
.option {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--accent);
  border-radius: 8px;
  margin: 12px 0;
  padding: 12px 16px;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
  font-size: 0.9rem;
  box-shadow: 0 0 5px rgba(0, 255, 200, 0.1);
}

.option:hover {
  background: rgba(0, 255, 200, 0.2);
  transform: scale(1.02);
  box-shadow: 0 0 10px rgba(0, 255, 200, 0.3);
}

#result {
  font-size: 1rem;
  color: var(--accent);
  margin-top: 20px;
}

/* 🔹 Progress bar */
.progress-container {
  width: 100%;
  background-color: rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  margin-bottom: 20px;
  height: 24px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background-color: var(--accent);
  text-align: center;
  line-height: 24px;
  color: #000;
  font-weight: bold;
  transition: width 0.3s;
  font-size: 0.8rem;
}

/* 🔹 Math Fun floating button with effect */
.funmathbutton {
  position: absolute;
  top: 10px;
  right: 15px;
  background: #00c6ff;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 22px;
  font-size: 0.9rem;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
}

.funmathbutton:hover {
  background: #0072ff;
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
}
.learningbutton {
  position: absolute;
  top: 10px;
  right: 105px;
  background: #00c6ff;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 12px 22px;
  font-size: 0.9rem;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
}
.learningbutton:hover{
  background: #0072ff;
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
}
/* 🔹 Quiz and report section spacing */
#quiz, #report {
  margin-top: 60px;
}

/* 🔹 Footer text */
footer, p a {
  font-size: 0.85rem;
  margin-top: 25px;
}

/* 🔹 Responsive tweaks */
@media (max-width: 768px) {
  .category-btn {
    font-size: 0.85rem;
  }
}

/* 🔹 Tablet screens (768px to 1024px) */
@media (max-width: 1024px) and (min-width: 768px) {
  .container {
    max-width: 800px;
    padding: 50px;
  }

  .category-btn {
    display: inline-block;
    width: auto;
    margin: 8px;
    padding: 10px 18px;
    font-size: 1rem;
  }

  h1 {
    margin-top: 30px;
    font-size: 1.7rem;
  }

  .funmathbutton {
    top: 30px;
    font-size: 0.9rem;
    padding: 10px 20px;
  }
}
.linksprivacy{
  color:rgb(217, 5, 5);
  font-size: medium;
}
.linksfeedback{
background: var(--accent);
  color: #000;

  cursor: pointer;
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;

}
.linksfeedback:hover{

}
.linksprivacy:hover{
color:blue;
}
/* 🔹 Laptop and large desktop screens (above 1024px) */
@media (min-width: 1025px) {

    max-width: 800px;
    padding: 50px;
  }

    margin: 10px 12px;
    padding: 12px 22px;
    font-size: 1rem;
  }

  h1 {
    margin-top: 20px;
    font-size: 2rem;
  }

    padding: 12px 24px;
  }

    padding: 12px 24px;
  }
}
